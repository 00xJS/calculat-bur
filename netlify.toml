# The previous rule here set Cache-Control for /data/*, a path this site does not have.
# Netlify already serves HTML with must-revalidate, so these are security headers instead.
#
# CSP notes: the page is a single file with an inline <style> and an inline <script>, so
# 'unsafe-inline' is required for script-src and style-src. (Inline onclick attributes are
# gone — every handler is now addEventListener — but an inline <script> block needs
# 'unsafe-inline' just the same. Dropping it would take either a CSP hash, which silently
# breaks the page on any un-rehashed edit, or splitting the app into separate .js/.css
# files, which would end the single-file property the fleet copies from this site.)
# Everything else is locked down: one CDN for Chart.js, one API for pricing (both the
# spot price and the market_chart history series), one API for history beyond a year
# (CoinGecko's public tier refuses any window wider than 365 days), data: for the
# emoji-SVG favicon.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.coingecko.com https://api.kraken.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
